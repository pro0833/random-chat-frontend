<div class="app">

  <!-- Header -->

  <header>

    <div class="logo">
      Random<span>Chat</span>
    </div>

    <div class="online">

      <span class="dot"></span>

      {{ message }}

    </div>

  </header>



  <!-- Videos -->

  <div class="video-container">

    <div class="video-box">

      <video
        #localVideo
        autoplay
        playsinline
        muted>
      </video>

      <div class="video-title">

        You

      </div>

    </div>



    <div class="video-box">

      <video
        #remoteVideo
        autoplay
        playsinline>
      </video>

      <div class="video-title">

        Stranger

      </div>

    </div>

  </div>



  <!-- Controls -->

  <div class="controls">

    <button
      class="start"
      *ngIf="chatState=='IDLE'||chatState=='ENDED'||chatState=='DISCONNECTED'"
      (click)="startChat()">

      ▶ Start

    </button>


    <button
      class="next"
      *ngIf="chatState!='IDLE'"
      (click)="nextChat()">

      ⏭ Next

    </button>


    <button
      class="mic"
      *ngIf="chatState!='IDLE'"
      (click)="toggleMicrophone()">

      {{isMicEnabled?'🎤 Mic':'🔇 Mic'}}

    </button>


    <button
      class="camera"
      *ngIf="chatState!='IDLE'"
      (click)="toggleCamera()">

      {{isCameraEnabled?'📹 Camera':'🚫 Camera'}}

    </button>


    <button
      class="end"
      *ngIf="chatState!='IDLE'"
      (click)="endChat()">

      ✕ End

    </button>

  </div>



  <footer>

    🔒 Peer-to-Peer Encrypted

  </footer>

</div>
