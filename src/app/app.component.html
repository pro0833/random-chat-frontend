<div class="app-shell">

  <!-- Header -->
  <header class="header">

    <div class="brand">
      <div class="brand-icon">R</div>

      <div>
        <h1>Random<span>Chat</span></h1>
        <p>Meet someone new</p>
      </div>
    </div>

    <div class="status">
      <span class="status-dot"></span>
      <span>Live</span>
    </div>

  </header>


  <!-- Main Content -->
  <main class="main-content">

    <section class="hero">

      <h2>Random Video Chat</h2>

      <p class="subtitle">
        Connect with a random person and start a conversation.
      </p>

    </section>


    <!-- Video Area -->
    <section class="video-grid">

      <!-- Local Video -->
      <div class="video-card">

        <video
          #localVideo
          autoplay
          playsinline
          muted>
        </video>

        <div class="video-label">
          <span class="live-dot"></span>
          You
        </div>

      </div>


      <!-- Remote Video -->
      <div class="video-card">

        <video
          #remoteVideo
          autoplay
          playsinline>
        </video>

        <div class="video-label">

          <span class="user-icon">👤</span>

          Stranger

        </div>

      </div>

    </section>


    <!-- Status -->
    <div class="connection-status">

      <span class="status-dot"></span>

      <span>{{ message }}</span>

    </div>


    <!-- Controls -->
    <div class="controls">

      <button
        class="start-button"
        (click)="startChat()"
        [disabled]="isConnected">

        <span class="button-icon">📹</span>

        {{ isConnected ? 'Searching...' : 'Start Chat' }}

      </button>

    </div>


    <!-- Small Info -->
    <div class="privacy-note">

      <span>🔒</span>

      <span>
        Your video connection is peer-to-peer.
      </span>

    </div>

  </main>


  <!-- Footer -->
  <footer class="footer">

    <p>
      Developed by
      <strong>Prasad & Aditya</strong>
    </p>

  

  </footer>

</div>
